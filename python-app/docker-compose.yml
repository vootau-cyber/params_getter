version: '3.8'

services:
  app:
    build: .
    container_name: params_getter
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # PostgreSQL connection (optional — overrides JSON config file)
      # Uncomment and fill these to configure DB without using the UI dialog
      # - PG_HOST=postgres
      # - PG_PORT=5432
      # - PG_DATABASE=maritime_db
      # - PG_USERNAME=postgres
      # - PG_PASSWORD=
      # - PG_SSL=false
      # - PG_GRAPH_NAME=
